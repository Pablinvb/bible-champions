<title>Bible Champions</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout concept: a lit sanctuary of deep indigo. The eight-slot wheel holds the centre and
   the teams ring it — left and right, then below, then the four corners. Every character is a
   gold-ringed medallion: one image serves the wheel, the team slots and the unlock sheet. */
:root{
  --bg-1:#1b1047; --bg-2:#0c0722; --bg-3:#3a1b8f;
  --panel:rgba(255,255,255,.085); --panel-2:rgba(255,255,255,.14); --panel-3:rgba(0,0,0,.26);
  --line:rgba(255,255,255,.17); --line-2:rgba(255,255,255,.32);
  --ink:#ffffff; --ink-2:#ddd5f5; --ink-3:#a79ad2;
  --gold:#ffc83d; --gold-2:#f0a500; --gold-ink:#3d2600; --ivory:#fff5df;
  --good:#19c97d; --good-ink:#02331c; --bad:#ff624f; --bad-ink:#3d0a04;
  /* Electric purple and royal blue from the brief, lifted just enough to stay legible as text
     on the dark background — they are used for names as well as for wheel slots. */
  --c-prophecy:#8b45f0; --c-history:#ff9f1c; --c-geography:#08c9cf; --c-art:#ff4eb8;
  --c-sports:#ff624f; --c-economics:#19c97d; --c-riddles:#3b82f6; --c-crown:#ffc83d;
  --r-s:12px; --r-m:18px; --r-l:26px; --r-xl:34px;
  --sh:0 10px 30px rgba(6,2,24,.5);
  --sh-lg:0 22px 60px rgba(6,2,24,.65);
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Outfit","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{min-height:100%}
body{
  margin:0;min-height:100%;font-family:var(--f-body);color:var(--ink);font-size:16px;line-height:1.45;
  background:
    radial-gradient(980px 660px at 50% -12%, var(--bg-3) 0%, transparent 62%),
    radial-gradient(720px 520px at 8% 102%, #0a6f9e 0%, transparent 58%),
    radial-gradient(680px 500px at 95% 88%, #8d2fb8 0%, transparent 58%),
    radial-gradient(520px 380px at 76% 8%, #c97a12 0%, transparent 62%),
    linear-gradient(180deg, var(--bg-1), var(--bg-2));
  background-attachment:fixed;-webkit-font-smoothing:antialiased;
}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column}
.wrap{width:100%;max-width:1360px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));}
h1,h2,h3,h4{margin:0;font-family:var(--f-display);font-weight:700;text-wrap:balance;letter-spacing:.2px}
p{margin:0}
button{font-family:inherit}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.spacer{flex:1 1 auto;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.eyebrow{font-family:var(--f-body);font-size:11.5px;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;
  font-family:var(--f-display);font-size:16px;font-weight:700;letter-spacing:.3px;
  color:var(--gold-ink);background:linear-gradient(180deg,var(--gold),var(--gold-2));
  border:0;border-radius:999px;padding:14px 26px;box-shadow:0 6px 0 #b67700,var(--sh);
  transition:transform .1s ease,box-shadow .1s ease,filter .15s ease}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b67700,var(--sh)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.lg{font-size:19px;padding:17px 36px}
.btn.sm{font-size:14px;padding:9px 16px;box-shadow:0 4px 0 #b67700}
.btn.sm:active{box-shadow:0 1px 0 #b67700}
.btn.block{width:100%}
.btn.ghost{color:#fff;background:var(--panel-2);box-shadow:0 4px 0 rgba(0,0,0,.3),var(--sh)}
.btn.ghost:active{box-shadow:0 1px 0 rgba(0,0,0,.3)}
.btn.ghost:hover{background:rgba(255,255,255,.22)}
.btn.danger{color:#fff;background:linear-gradient(180deg,#ff6f5d,#e0392a);box-shadow:0 4px 0 #9c1f14,var(--sh)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;
  border-radius:50%;border:1px solid var(--line);background:var(--panel);color:#fff;font-size:17px;
  cursor:pointer;transition:background .15s,transform .12s}
.icon-btn:hover{background:var(--panel-2)}
.icon-btn:active{transform:scale(.93)}
.icon-btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.icon-btn.on{background:var(--gold);color:var(--gold-ink);border-color:transparent}

/* ---------- surfaces ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);
  box-shadow:var(--sh);padding:22px;backdrop-filter:blur(6px)}
.card.flat{background:var(--panel-3);box-shadow:none}
.card.tight{padding:15px;border-radius:var(--r-m)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 13px;
  font-size:13.5px;font-weight:800;background:var(--panel-2);border:1px solid var(--line)}
.chip.gold{background:var(--gold);color:var(--gold-ink);border-color:transparent}
.chip.warn{background:rgba(255,98,79,.2);border-color:var(--bad);color:#ffd7d1}
.tag{display:inline-flex;align-items:center;font-size:11px;font-weight:800;letter-spacing:.07em;
  text-transform:uppercase;padding:4px 9px;border-radius:7px;background:var(--panel-2);
  border:1px solid var(--line);color:var(--ink-2)}
.tag.cat{background:var(--cc);color:#120726;border-color:transparent}
.tag.ref{background:rgba(255,200,61,.17);border-color:var(--gold);color:var(--gold);
  text-transform:none;letter-spacing:.02em;font-size:11.5px}
.tag.warn{background:rgba(255,98,79,.2);border-color:var(--bad);color:#ffb3a8;text-transform:none}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding-block:16px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:19px;font-weight:800;letter-spacing:.4px}
.brand span{color:var(--gold)}

/* ---------- character medallions ---------- */
/* The art is a portrait crop on its own painted backdrop, so every tile is a circular
   medallion with a gold ring: the crop reads as deliberate framing rather than a bad cutout. */
.ctile{position:relative;display:block;aspect-ratio:1/1;min-width:0;border-radius:50%;overflow:hidden;
  background:#1a0f3d;box-shadow:0 0 0 3px rgba(255,255,255,.85),0 6px 16px rgba(0,0,0,.5)}
.ctile img{width:100%;height:100%;object-fit:cover;object-position:50% 2%;display:block}
.ctile.on{box-shadow:0 0 0 3px var(--cc),0 0 20px color-mix(in srgb,var(--cc) 55%,transparent),0 6px 16px rgba(0,0,0,.5)}
.ctile.dim img{filter:grayscale(1) brightness(.42)}
.ctile.dim{box-shadow:0 0 0 2px rgba(255,255,255,.2)}
.ctile.tall{border-radius:var(--r-l);aspect-ratio:253/455}
.ctile.tall img{object-position:50% 50%}

/* ---------- home ---------- */
.home{display:flex;flex-direction:column;align-items:center;gap:24px;padding-block:6px 52px;text-align:center}
.logo{font-family:var(--f-display);font-weight:800;line-height:1;letter-spacing:.5px}
.logo .l1{display:block;font-size:clamp(32px,7vw,74px);color:#fff;
  text-shadow:0 4px 0 #3a1b8f,0 10px 26px rgba(0,0,0,.55)}
.logo .l2{display:block;font-size:clamp(32px,7vw,74px);
  background:linear-gradient(180deg,#ffe9a3,var(--gold) 55%,#e08900);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 #8a5a00) drop-shadow(0 12px 24px rgba(255,180,40,.35))}
.tagline{font-size:clamp(15px,1.9vw,20px);font-weight:700;color:var(--ivory)}
.crown-hero{width:min(42vw,180px);animation:bob 4s ease-in-out infinite;
  box-shadow:0 0 0 4px var(--gold),0 0 44px rgba(255,200,61,.55),0 10px 30px rgba(0,0,0,.5)}
.cast{display:grid;grid-template-columns:repeat(7,1fr);gap:clamp(5px,1.1vw,14px);width:100%;max-width:1040px}
@media (max-width:760px){.cast{grid-template-columns:repeat(4,1fr)}}
.cast figure{margin:0;display:flex;flex-direction:column;gap:6px;align-items:center}
.cast .ctile{width:100%;animation:bob 4.5s ease-in-out infinite}
.cast figure:nth-child(2) .ctile{animation-delay:.25s}
.cast figure:nth-child(3) .ctile{animation-delay:.5s}
.cast figure:nth-child(4) .ctile{animation-delay:.75s}
.cast figure:nth-child(5) .ctile{animation-delay:1s}
.cast figure:nth-child(6) .ctile{animation-delay:1.25s}
.cast figure:nth-child(7) .ctile{animation-delay:1.5s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.cast figcaption{font-family:var(--f-display);font-size:clamp(11px,1.3vw,15px);font-weight:700;color:var(--cc)}
.cast figcaption small{display:block;font-family:var(--f-body);font-size:9.5px;font-weight:800;
  letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-top:1px}
.home-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.home-note{color:var(--ink-2);max-width:58ch;font-size:15px;font-weight:500}

/* ---------- forms ---------- */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.label{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.hint{font-size:13px;color:var(--ink-3);font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:7px}
.seg button{font-family:var(--f-body);font-size:14px;font-weight:800;color:var(--ink-2);cursor:pointer;
  background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 16px;transition:all .14s}
.seg button:hover{background:var(--panel-2);color:#fff}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:transparent}
.seg button:focus-visible{outline:3px solid #fff;outline-offset:2px}
input[type=text],textarea,select{font-family:var(--f-body);font-size:15px;font-weight:600;color:#fff;
  background:var(--panel-3);border:1px solid var(--line);border-radius:12px;padding:11px 14px;width:100%}
textarea{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;font-weight:400;min-height:190px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:3px solid var(--gold);outline-offset:1px;border-color:transparent}
select option{background:#1b1047;color:#fff}
.swatches{display:flex;gap:7px;flex-wrap:wrap}
.swatch{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;transition:transform .12s}
.swatch[aria-pressed="true"]{border-color:#fff;transform:scale(1.15)}
.team-row{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;padding:15px;border-radius:var(--r-m);
  background:var(--panel-3);border:1px solid var(--line);border-left:4px solid var(--tc)}
.team-row .field{flex:1 1 190px}

/* ---------- the arena ---------- */
.arena{display:grid;gap:clamp(10px,1.6vw,20px);align-items:center;justify-items:center;
  grid-template-columns:minmax(0,215px) minmax(0,1fr) minmax(0,215px);
  grid-template-rows:auto auto auto;padding-bottom:30px}
.arena .center{grid-column:2;grid-row:2;width:100%;display:flex;flex-direction:column;
  align-items:center;gap:16px;min-width:0}
@media (max-width:960px){
  .arena{grid-template-columns:1fr 1fr;grid-template-rows:auto auto}
  .arena .center{grid-column:1/-1;grid-row:1}
  .arena .seat{grid-column:auto!important;grid-row:auto!important;width:100%}
}
.seat{width:100%;max-width:250px;justify-self:center}

/* wheel */
.wheel-stage{position:relative;width:min(100%,470px);aspect-ratio:1/1;display:grid;place-items:center;margin-inline:auto}
.wheel-rotor{width:100%;height:100%;transform:rotate(0deg)}
.wheel-rotor.spin{transition:transform 5.2s cubic-bezier(.13,.78,.1,1)}
.wheel-glow{position:absolute;inset:-9%;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,200,61,.26),transparent 62%);filter:blur(16px)}
.pointer{position:absolute;top:-2px;left:50%;transform:translateX(-50%);z-index:3;width:0;height:0;
  border-left:17px solid transparent;border-right:17px solid transparent;border-top:30px solid #fff;
  filter:drop-shadow(0 3px 5px rgba(0,0,0,.55))}
.pointer.hit{animation:tick .45s cubic-bezier(.3,1.6,.4,1)}
@keyframes tick{0%{transform:translateX(-50%) rotate(0)}35%{transform:translateX(-50%) rotate(-16deg)}100%{transform:translateX(-50%) rotate(0)}}
.spin-hub{position:absolute;width:25%;aspect-ratio:1;border-radius:50%;z-index:2;cursor:pointer;
  border:5px solid #fff;background:linear-gradient(180deg,var(--gold),var(--gold-2));color:var(--gold-ink);
  font-family:var(--f-display);font-size:clamp(13px,2.1vw,21px);font-weight:800;letter-spacing:.5px;
  box-shadow:0 8px 24px rgba(0,0,0,.5);transition:transform .12s}
.spin-hub:not([disabled]){animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.spin-hub:active:not([disabled]){transform:scale(.94)}
.spin-hub[disabled]{opacity:.55;cursor:default;animation:none}
.spin-hub:focus-visible{outline:3px solid #fff;outline-offset:4px}
.cat-reveal{display:flex;align-items:center;gap:14px;animation:popin .45s cubic-bezier(.2,1.5,.4,1) both}
.cat-reveal .ctile{width:96px;flex:0 0 auto}
.cat-reveal .nm{font-family:var(--f-display);font-size:clamp(20px,3vw,30px);font-weight:700;color:var(--cc)}
.cat-reveal .nm small{display:block;font-family:var(--f-body);font-size:12px;font-weight:800;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
@keyframes popin{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}

/* turn bar */
.turn-bar{width:100%;display:flex;align-items:center;gap:13px;flex-wrap:wrap;border-radius:999px;
  padding:11px 20px;background:linear-gradient(90deg,var(--tc),rgba(255,255,255,.08));
  border:1px solid var(--line);box-shadow:var(--sh)}
.turn-bar .who{font-family:var(--f-display);font-size:clamp(16px,2.1vw,22px);font-weight:700}

/* live standings */
.standings{display:flex;gap:8px;flex-wrap:wrap;margin:11px 0 3px}
.rchip{display:inline-flex;align-items:center;gap:8px;padding:6px 13px;border-radius:999px;
  background:var(--panel);border:1px solid var(--line);font-size:12.5px;font-weight:800;color:var(--ink-2)}
.rchip.live{border-color:var(--gold);color:#fff;box-shadow:0 0 0 1px var(--gold)}
.rchip .pos{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:50%;
  background:var(--tc);color:#fff;font-size:11px}
.rchip .nm{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rchip .sc{color:var(--gold)}

/* the wheel changing hands */
.turn-card{position:fixed;inset:0;z-index:40;display:grid;place-items:center;pointer-events:none}
.turn-card .inner{display:flex;flex-direction:column;align-items:center;gap:7px;padding:24px 48px;
  border-radius:var(--r-xl);box-shadow:var(--sh-lg);text-align:center;
  background:linear-gradient(180deg,var(--tc),rgba(8,3,26,.86));border:2px solid rgba(255,255,255,.45);
  animation:turnIn 1.7s ease-out both}
.turn-card .nm{font-family:var(--f-display);font-size:clamp(27px,5.4vw,54px);font-weight:800;line-height:1.1}
@keyframes turnIn{0%{opacity:0;transform:translateY(26px) scale(.9)}
  11%{opacity:1;transform:none}82%{opacity:1;transform:none}100%{opacity:0;transform:scale(1.05)}}

/* team seat card */
.team-card{position:relative;width:100%;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--tc);
  border-radius:var(--r-m);padding:12px;box-shadow:var(--sh);transition:transform .2s,box-shadow .2s}
.team-card .pop{position:absolute;right:13px;top:30px;z-index:2;pointer-events:none;
  font-family:var(--f-display);font-size:20px;font-weight:800;color:var(--good);
  text-shadow:0 2px 7px rgba(0,0,0,.7);animation:pointsUp 1.2s ease-out forwards}
@keyframes pointsUp{0%{opacity:0;transform:translateY(10px) scale(.8)}
  20%{opacity:1;transform:translateY(0) scale(1.12)}100%{opacity:0;transform:translateY(-36px) scale(1)}}
.team-card.active{transform:translateY(-3px) scale(1.03);box-shadow:0 0 0 2px var(--gold),var(--sh-lg)}
.team-card .thead{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.team-card .tname{font-family:var(--f-display);font-size:15px;font-weight:700;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.team-card .score{font-family:var(--f-display);font-size:19px;font-weight:800;color:var(--gold)}
.slots{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.slots .ctile{box-shadow:0 0 0 2px rgba(255,255,255,.5)}
.slots .ctile.on{box-shadow:0 0 0 2px var(--cc),0 0 12px color-mix(in srgb,var(--cc) 60%,transparent)}
/* how close this team is to that champion, when more than one right answer is needed */
.slot{display:block}
.pbar{display:block;height:3px;margin-top:3px;border-radius:999px;background:rgba(255,255,255,.18);overflow:hidden}
.pbar b{display:block;height:100%;border-radius:999px;background:var(--cc);transition:width .45s ease}
.meter{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:11.5px;font-weight:800;color:var(--ink-3)}
.ll-mini{display:flex;gap:3px}
.ll-mini span{display:inline-flex;align-items:center;gap:1px;justify-content:center;
  min-width:19px;height:19px;padding:0 3px;border-radius:6px;
  background:rgba(255,255,255,.14);color:var(--ink-2)}
.ll-mini span.spent{opacity:.25}
.ll-mini b{font-size:10px;line-height:1;color:var(--gold)}
.prog{display:flex;gap:3px}
.pip{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.22)}
.pip.on{background:var(--gold)}

/* question */
.qcard{width:100%;max-width:900px;display:flex;flex-direction:column;gap:15px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-xl);
  box-shadow:var(--sh-lg);padding:clamp(16px,2.6vw,26px);backdrop-filter:blur(8px)}
.qcard.crown{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,200,61,.5),var(--sh-lg)}
.qhead{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.qhead .ctile{width:54px;flex:0 0 auto}
.qhead .cat{font-family:var(--f-display);font-size:17px;font-weight:700;color:var(--cc)}
.timer-track{width:100%;height:10px;border-radius:999px;background:rgba(0,0,0,.33);overflow:hidden}
.timer-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--good),var(--gold));transition:width .25s linear}
.timer-fill.warn{background:linear-gradient(90deg,var(--gold),var(--bad));animation:flash .7s infinite}
@keyframes flash{50%{opacity:.55}}
.qtext{font-family:var(--f-display);font-size:clamp(19px,2.6vw,31px);font-weight:700;line-height:1.25}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:11px}
.opt{display:flex;align-items:center;gap:13px;text-align:left;cursor:pointer;width:100%;
  font-family:var(--f-body);font-size:clamp(15px,1.6vw,17.5px);font-weight:700;color:#fff;
  background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-m);padding:14px 16px;
  transition:transform .1s,background .14s,border-color .14s}
/* Four answers, four colours. The tint stays light and the letter carries the colour, so a long
   verse is still read as text rather than fought through. */
.opt:nth-child(1){--ok:#3b82f6;--oi:#ffffff}
.opt:nth-child(2){--ok:#19c97d;--oi:#02331c}
.opt:nth-child(3){--ok:#ff9f1c;--oi:#3d2600}
.opt:nth-child(4){--ok:#c05cf0;--oi:#ffffff}
.opt{border-left:5px solid var(--ok);
  background:linear-gradient(90deg,color-mix(in srgb,var(--ok) 26%,transparent),var(--panel-2) 62%)}
.opt:hover:not([disabled]){transform:translateY(-2px);
  background:linear-gradient(90deg,color-mix(in srgb,var(--ok) 48%,transparent),var(--panel-2) 72%)}
.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.opt .key{flex:0 0 auto;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--f-display);font-size:15px;font-weight:700;
  background:var(--ok);color:var(--oi)}
