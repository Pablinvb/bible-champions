<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Bible Champions: a team Bible trivia game. Spin the eight-slot wheel, answer from the Scriptures and collect all seven champions.">
<meta name="theme-color" content="#1b1047">
<meta property="og:title" content="Bible Champions">
<meta property="og:description" content="Explore the Bible. Collect the Champions. Win the Crown!">
<meta property="og:type" content="website">
<meta property="og:image" content="social-card.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.png" type="image/png">
<style>
  :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  body{margin:0}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>Bible Champions</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout concept: a lit sanctuary of deep indigo. The eight-slot wheel holds the centre and
   the teams ring it — left and right, then below, then the four corners. Every character is a
   gold-ringed medallion: one image serves the wheel, the team slots and the unlock sheet. */
:root{
  --bg-1:#1b1047; --bg-2:#0c0722; --bg-3:#3a1b8f;
  --panel:rgba(255,255,255,.085); --panel-2:rgba(255,255,255,.14); --panel-3:rgba(0,0,0,.26);
  --line:rgba(255,255,255,.17); --line-2:rgba(255,255,255,.32);
  --ink:#ffffff; --ink-2:#ddd5f5; --ink-3:#a79ad2;
  --gold:#ffc83d; --gold-2:#f0a500; --gold-ink:#3d2600; --ivory:#fff5df;
  --good:#19c97d; --good-ink:#02331c; --bad:#ff624f; --bad-ink:#3d0a04;
  /* Electric purple and royal blue from the brief, lifted just enough to stay legible as text
     on the dark background — they are used for names as well as for wheel slots. */
  --c-prophecy:#8b45f0; --c-history:#ff9f1c; --c-geography:#08c9cf; --c-art:#ff4eb8;
  --c-sports:#ff624f; --c-economics:#19c97d; --c-riddles:#3b82f6; --c-crown:#ffc83d;
  --r-s:12px; --r-m:18px; --r-l:26px; --r-xl:34px;
  --sh:0 10px 30px rgba(6,2,24,.5);
  --sh-lg:0 22px 60px rgba(6,2,24,.65);
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Outfit","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{min-height:100%}
body{
  margin:0;min-height:100%;font-family:var(--f-body);color:var(--ink);font-size:16px;line-height:1.45;
  background:
    radial-gradient(980px 660px at 50% -12%, var(--bg-3) 0%, transparent 62%),
    radial-gradient(720px 520px at 8% 102%, #0a6f9e 0%, transparent 58%),
    radial-gradient(680px 500px at 95% 88%, #8d2fb8 0%, transparent 58%),
    radial-gradient(520px 380px at 76% 8%, #c97a12 0%, transparent 62%),
    linear-gradient(180deg, var(--bg-1), var(--bg-2));
  background-attachment:fixed;-webkit-font-smoothing:antialiased;
}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column}
.wrap{width:100%;max-width:1360px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));}
h1,h2,h3,h4{margin:0;font-family:var(--f-display);font-weight:700;text-wrap:balance;letter-spacing:.2px}
p{margin:0}
button{font-family:inherit}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.spacer{flex:1 1 auto;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.eyebrow{font-family:var(--f-body);font-size:11.5px;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;
  font-family:var(--f-display);font-size:16px;font-weight:700;letter-spacing:.3px;
  color:var(--gold-ink);background:linear-gradient(180deg,var(--gold),var(--gold-2));
  border:0;border-radius:999px;padding:14px 26px;box-shadow:0 6px 0 #b67700,var(--sh);
  transition:transform .1s ease,box-shadow .1s ease,filter .15s ease}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b67700,var(--sh)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.lg{font-size:19px;padding:17px 36px}
.btn.sm{font-size:14px;padding:9px 16px;box-shadow:0 4px 0 #b67700}
.btn.sm:active{box-shadow:0 1px 0 #b67700}
.btn.block{width:100%}
.btn.ghost{color:#fff;background:var(--panel-2);box-shadow:0 4px 0 rgba(0,0,0,.3),var(--sh)}
.btn.ghost:active{box-shadow:0 1px 0 rgba(0,0,0,.3)}
.btn.ghost:hover{background:rgba(255,255,255,.22)}
.btn.danger{color:#fff;background:linear-gradient(180deg,#ff6f5d,#e0392a);box-shadow:0 4px 0 #9c1f14,var(--sh)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;
  border-radius:50%;border:1px solid var(--line);background:var(--panel);color:#fff;font-size:17px;
  cursor:pointer;transition:background .15s,transform .12s}
.icon-btn:hover{background:var(--panel-2)}
.icon-btn:active{transform:scale(.93)}
.icon-btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.icon-btn.on{background:var(--gold);color:var(--gold-ink);border-color:transparent}

/* ---------- surfaces ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);
  box-shadow:var(--sh);padding:22px;backdrop-filter:blur(6px)}
.card.flat{background:var(--panel-3);box-shadow:none}
.card.tight{padding:15px;border-radius:var(--r-m)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 13px;
  font-size:13.5px;font-weight:800;background:var(--panel-2);border:1px solid var(--line)}
.chip.gold{background:var(--gold);color:var(--gold-ink);border-color:transparent}
.tag{display:inline-flex;align-items:center;font-size:11px;font-weight:800;letter-spacing:.07em;
  text-transform:uppercase;padding:4px 9px;border-radius:7px;background:var(--panel-2);
  border:1px solid var(--line);color:var(--ink-2)}
.tag.cat{background:var(--cc);color:#120726;border-color:transparent}
.tag.ref{background:rgba(255,200,61,.17);border-color:var(--gold);color:var(--gold);
  text-transform:none;letter-spacing:.02em;font-size:11.5px}
.tag.warn{background:rgba(255,98,79,.2);border-color:var(--bad);color:#ffb3a8;text-transform:none}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding-block:16px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:19px;font-weight:800;letter-spacing:.4px}
.brand span{color:var(--gold)}

/* ---------- character medallions ---------- */
/* The art is a portrait crop on its own painted backdrop, so every tile is a circular
   medallion with a gold ring: the crop reads as deliberate framing rather than a bad cutout. */
.ctile{position:relative;display:block;aspect-ratio:1/1;min-width:0;border-radius:50%;overflow:hidden;
  background:#1a0f3d;box-shadow:0 0 0 3px rgba(255,255,255,.85),0 6px 16px rgba(0,0,0,.5)}
.ctile img{width:100%;height:100%;object-fit:cover;object-position:50% 2%;display:block}
.ctile.on{box-shadow:0 0 0 3px var(--cc),0 0 20px color-mix(in srgb,var(--cc) 55%,transparent),0 6px 16px rgba(0,0,0,.5)}
.ctile.dim img{filter:grayscale(1) brightness(.42)}
.ctile.dim{box-shadow:0 0 0 2px rgba(255,255,255,.2)}
.ctile.tall{border-radius:var(--r-l);aspect-ratio:253/455}
.ctile.tall img{object-position:50% 50%}

/* ---------- home ---------- */
.home{display:flex;flex-direction:column;align-items:center;gap:24px;padding-block:6px 52px;text-align:center}
.logo{font-family:var(--f-display);font-weight:800;line-height:1;letter-spacing:.5px}
.logo .l1{display:block;font-size:clamp(32px,7vw,74px);color:#fff;
  text-shadow:0 4px 0 #3a1b8f,0 10px 26px rgba(0,0,0,.55)}
.logo .l2{display:block;font-size:clamp(32px,7vw,74px);
  background:linear-gradient(180deg,#ffe9a3,var(--gold) 55%,#e08900);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 #8a5a00) drop-shadow(0 12px 24px rgba(255,180,40,.35))}
.tagline{font-size:clamp(15px,1.9vw,20px);font-weight:700;color:var(--ivory)}
.crown-hero{width:min(42vw,180px);animation:bob 4s ease-in-out infinite;
  box-shadow:0 0 0 4px var(--gold),0 0 44px rgba(255,200,61,.55),0 10px 30px rgba(0,0,0,.5)}
.cast{display:grid;grid-template-columns:repeat(7,1fr);gap:clamp(5px,1.1vw,14px);width:100%;max-width:1040px}
@media (max-width:760px){.cast{grid-template-columns:repeat(4,1fr)}}
.cast figure{margin:0;display:flex;flex-direction:column;gap:6px;align-items:center}
.cast .ctile{width:100%;animation:bob 4.5s ease-in-out infinite}
.cast figure:nth-child(2) .ctile{animation-delay:.25s}
.cast figure:nth-child(3) .ctile{animation-delay:.5s}
.cast figure:nth-child(4) .ctile{animation-delay:.75s}
.cast figure:nth-child(5) .ctile{animation-delay:1s}
.cast figure:nth-child(6) .ctile{animation-delay:1.25s}
.cast figure:nth-child(7) .ctile{animation-delay:1.5s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.cast figcaption{font-family:var(--f-display);font-size:clamp(11px,1.3vw,15px);font-weight:700;color:var(--cc)}
.cast figcaption small{display:block;font-family:var(--f-body);font-size:9.5px;font-weight:800;
  letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-top:1px}
.home-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.home-note{color:var(--ink-2);max-width:58ch;font-size:15px;font-weight:500}

/* ---------- forms ---------- */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.label{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.hint{font-size:13px;color:var(--ink-3);font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:7px}
.seg button{font-family:var(--f-body);font-size:14px;font-weight:800;color:var(--ink-2);cursor:pointer;
  background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 16px;transition:all .14s}
.seg button:hover{background:var(--panel-2);color:#fff}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:transparent}
.seg button:focus-visible{outline:3px solid #fff;outline-offset:2px}
input[type=text],textarea,select{font-family:var(--f-body);font-size:15px;font-weight:600;color:#fff;
  background:var(--panel-3);border:1px solid var(--line);border-radius:12px;padding:11px 14px;width:100%}
textarea{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;font-weight:400;min-height:190px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:3px solid var(--gold);outline-offset:1px;border-color:transparent}
select option{background:#1b1047;color:#fff}
.swatches{display:flex;gap:7px;flex-wrap:wrap}
.swatch{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;transition:transform .12s}
.swatch[aria-pressed="true"]{border-color:#fff;transform:scale(1.15)}
.team-row{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;padding:15px;border-radius:var(--r-m);
  background:var(--panel-3);border:1px solid var(--line);border-left:4px solid var(--tc)}
.team-row .field{flex:1 1 190px}

/* ---------- the arena ---------- */
.arena{display:grid;gap:clamp(10px,1.6vw,20px);align-items:center;justify-items:center;
  grid-template-columns:minmax(0,215px) minmax(0,1fr) minmax(0,215px);
  grid-template-rows:auto auto auto;padding-bottom:30px}
.arena .center{grid-column:2;grid-row:2;width:100%;display:flex;flex-direction:column;
  align-items:center;gap:16px;min-width:0}
@media (max-width:960px){
  .arena{grid-template-columns:1fr 1fr;grid-template-rows:auto auto}
  .arena .center{grid-column:1/-1;grid-row:1}
  .arena .seat{grid-column:auto!important;grid-row:auto!important;width:100%}
}
.seat{width:100%;max-width:250px;justify-self:center}

/* wheel */
.wheel-stage{position:relative;width:min(100%,470px);aspect-ratio:1/1;display:grid;place-items:center;margin-inline:auto}
.wheel-rotor{width:100%;height:100%;transform:rotate(0deg)}
.wheel-rotor.spin{transition:transform 5.2s cubic-bezier(.13,.78,.1,1)}
.wheel-glow{position:absolute;inset:-9%;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,200,61,.26),transparent 62%);filter:blur(16px)}
.pointer{position:absolute;top:-2px;left:50%;transform:translateX(-50%);z-index:3;width:0;height:0;
  border-left:17px solid transparent;border-right:17px solid transparent;border-top:30px solid #fff;
  filter:drop-shadow(0 3px 5px rgba(0,0,0,.55))}
.pointer.hit{animation:tick .45s cubic-bezier(.3,1.6,.4,1)}
@keyframes tick{0%{transform:translateX(-50%) rotate(0)}35%{transform:translateX(-50%) rotate(-16deg)}100%{transform:translateX(-50%) rotate(0)}}
.spin-hub{position:absolute;width:25%;aspect-ratio:1;border-radius:50%;z-index:2;cursor:pointer;
  border:5px solid #fff;background:linear-gradient(180deg,var(--gold),var(--gold-2));color:var(--gold-ink);
  font-family:var(--f-display);font-size:clamp(13px,2.1vw,21px);font-weight:800;letter-spacing:.5px;
  box-shadow:0 8px 24px rgba(0,0,0,.5);transition:transform .12s}
.spin-hub:not([disabled]){animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.spin-hub:active:not([disabled]){transform:scale(.94)}
.spin-hub[disabled]{opacity:.55;cursor:default;animation:none}
.spin-hub:focus-visible{outline:3px solid #fff;outline-offset:4px}
.cat-reveal{display:flex;align-items:center;gap:14px;animation:popin .45s cubic-bezier(.2,1.5,.4,1) both}
.cat-reveal .ctile{width:96px;flex:0 0 auto}
.cat-reveal .nm{font-family:var(--f-display);font-size:clamp(20px,3vw,30px);font-weight:700;color:var(--cc)}
.cat-reveal .nm small{display:block;font-family:var(--f-body);font-size:12px;font-weight:800;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
@keyframes popin{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}

/* turn bar */
.turn-bar{width:100%;display:flex;align-items:center;gap:13px;flex-wrap:wrap;border-radius:999px;
  padding:11px 20px;background:linear-gradient(90deg,var(--tc),rgba(255,255,255,.08));
  border:1px solid var(--line);box-shadow:var(--sh)}
.turn-bar .who{font-family:var(--f-display);font-size:clamp(16px,2.1vw,22px);font-weight:700}

/* team seat card */
.team-card{width:100%;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--tc);
  border-radius:var(--r-m);padding:12px;box-shadow:var(--sh);transition:transform .2s,box-shadow .2s}
.team-card.active{transform:translateY(-3px) scale(1.03);box-shadow:0 0 0 2px var(--gold),var(--sh-lg)}
.team-card .thead{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.team-card .tname{font-family:var(--f-display);font-size:15px;font-weight:700;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.team-card .score{font-family:var(--f-display);font-size:19px;font-weight:800;color:var(--gold)}
.slots{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.slots .ctile{box-shadow:0 0 0 2px rgba(255,255,255,.5)}
.slots .ctile.on{box-shadow:0 0 0 2px var(--cc),0 0 12px color-mix(in srgb,var(--cc) 60%,transparent)}
.meter{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:11.5px;font-weight:800;color:var(--ink-3)}
.ll-mini{display:flex;gap:3px}
.ll-mini span{display:inline-flex;align-items:center;gap:1px;justify-content:center;
  min-width:19px;height:19px;padding:0 3px;border-radius:6px;
  background:rgba(255,255,255,.14);color:var(--ink-2)}
.ll-mini span.spent{opacity:.25}
.ll-mini b{font-size:10px;line-height:1;color:var(--gold)}
.prog{display:flex;gap:3px}
.pip{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.22)}
.pip.on{background:var(--gold)}

/* question */
.qcard{width:100%;max-width:900px;display:flex;flex-direction:column;gap:15px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-xl);
  box-shadow:var(--sh-lg);padding:clamp(16px,2.6vw,26px);backdrop-filter:blur(8px)}
.qcard.crown{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,200,61,.5),var(--sh-lg)}
.qhead{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.qhead .ctile{width:54px;flex:0 0 auto}
.qhead .cat{font-family:var(--f-display);font-size:17px;font-weight:700;color:var(--cc)}
.timer-track{width:100%;height:10px;border-radius:999px;background:rgba(0,0,0,.33);overflow:hidden}
.timer-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--good),var(--gold));transition:width .25s linear}
.timer-fill.warn{background:linear-gradient(90deg,var(--gold),var(--bad));animation:flash .7s infinite}
@keyframes flash{50%{opacity:.55}}
.qtext{font-family:var(--f-display);font-size:clamp(19px,2.6vw,31px);font-weight:700;line-height:1.25}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:11px}
.opt{display:flex;align-items:center;gap:13px;text-align:left;cursor:pointer;width:100%;
  font-family:var(--f-body);font-size:clamp(15px,1.6vw,17.5px);font-weight:700;color:#fff;
  background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-m);padding:14px 16px;
  transition:transform .1s,background .14s,border-color .14s}
.opt:hover:not([disabled]){background:rgba(255,255,255,.24);transform:translateY(-2px)}
.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.opt .key{flex:0 0 auto;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--f-display);font-size:15px;font-weight:700;background:rgba(0,0,0,.32)}
.opt.correct{background:var(--good);color:var(--good-ink);border-color:transparent;animation:popin .35s}
.opt.correct .key{background:rgba(0,0,0,.2)}
.opt.wrong{background:var(--bad);color:var(--bad-ink);border-color:transparent;animation:shake .4s}
.opt.wrong .key{background:rgba(0,0,0,.2)}
.opt.dim{opacity:.4}
.opt[disabled]{cursor:default}
/* blown away by the bomb, and struck out by a spent second chance */
.opt.gone{opacity:0;pointer-events:none;transform:scale(.9);transition:opacity .3s,transform .3s}
.opt.struck{opacity:.45;text-decoration:line-through;border-color:var(--bad);animation:shake .4s}
.opt.struck .key{background:var(--bad);color:var(--bad-ink)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(6px)}}
.verdict{display:flex;align-items:center;gap:11px;border-radius:var(--r-m);padding:13px 17px;font-weight:900;
  animation:popin .3s both;flex-wrap:wrap}
.verdict.ok{background:rgba(25,201,125,.18);border:1px solid var(--good);color:var(--good)}
.verdict.no{background:rgba(255,98,79,.18);border:1px solid var(--bad);color:var(--bad)}
.verdict .big{font-family:var(--f-display);font-size:clamp(17px,2vw,23px);font-weight:700}
.explain{background:var(--panel-3);border:1px solid var(--line);border-radius:var(--r-m);
  padding:14px 16px;font-size:15px;line-height:1.5;color:var(--ink-2);font-weight:500}
.explain b{color:#fff}
.explain .scripture{display:inline-flex;margin-bottom:7px}

/* lifelines */
/* Five lifelines have to sit on one line inside the question card, so the chips stay tight. */
.lifelines{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:2px}
.lifelines .hint{flex:1 1 100%;margin-top:-4px}
.ll{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-family:var(--f-body);
  font-size:13.5px;font-weight:800;color:#fff;background:var(--panel-2);border:1px solid var(--line);
  border-radius:999px;padding:8px 12px;transition:transform .12s,background .14s,color .14s}
.ll:hover:not([disabled]){background:var(--gold);color:var(--gold-ink);border-color:transparent;transform:translateY(-2px)}

.pick-btn .nm{font-family:var(--f-display);font-size:14.5px;font-weight:700;color:var(--cc)}

.sheet.wide{max-width:860px}

.sheet .hero{width:min(54vw,220px);animation:heroIn .65s cubic-bezier(.2,1.4,.35,1) both}
@keyframes heroIn{from{opacity:0;transform:scale(.4) rotate(-12deg)}to{opacity:1;transform:none}}

/* steps + bank */
.steps{display:grid;gap:17px}
.step{display:flex;gap:14px;align-items:flex-start}

.step p{color:var(--ink-2);font-size:14.5px;font-weight:500}
.bank-list{display:flex;flex-direction:column;gap:9px;margin-top:14px}

/* ============================ utilities ============================ */
function lsGet(k,d){ try{var v=localStorage.getItem(k); return v?JSON.parse(v):d;}catch(e){return d;} }
function lsSet(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} }
function lsDel(k){ try{localStorage.removeItem(k);}catch(e){} }
function uid(p){ return (p||"BIB-x")+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function shuffle(a){ var r=a.slice(); for(var i=r.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=r[i];r[i]=r[j];r[j]=t;} return r; }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function catOf(id){ return CAT_BY_ID[id]||CATS[0]; }
function catVars(id){ return {"--cc":"var(--c-"+id+")"}; }
/* the side of a bilingual row for the active language, falling back to the other one */
function side(q,lang){
  var l=lang||LANG;
  var s=q[l];
  if(s&&s.q) return s;
  return q.en&&q.en.q?q.en:(q.es||{q:"",o:["","","",""],e:"",ref:""});
}

/* ============================ audio ============================ */
/* Music comes from real files dropped into audio/ — see the README. Anything missing just
   stays silent. The short cues are synthesised so the game never waits on a download. */
var MUSIC_FILES={ menu:"audio/menu.mp3", board:"audio/board.mp3", quiz:"audio/question.mp3", victory:"audio/victory.mp3" };
var MUSIC_FALLBACK={ board:"menu", quiz:"board", victory:"menu" };
var A={ ctx:null, master:null, sfxOn:true, musicOn:true, vol:0.75, noise:null,
        players:{}, track:null, want:null, unlocked:false, preloaded:false };
function audioInit(){
  if(A.ctx!==null) return A.ctx;
  try{ A.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ A.ctx=false; return null; }
  A.master=A.ctx.createGain(); A.master.gain.value=A.vol; A.master.connect(A.ctx.destination);
  var len=A.ctx.sampleRate*0.5, buf=A.ctx.createBuffer(1,len,A.ctx.sampleRate), d=buf.getChannelData(0);
  for(var i=0;i<len;i++) d[i]=Math.random()*2-1;
  A.noise=buf;
  return A.ctx;
}
function player(name){
  if(A.players[name]!==undefined) return A.players[name];
  var src=MUSIC_FILES[name]; if(!src){ A.players[name]=null; return null; }
  var el=new Audio(src);
  el.loop=(name!=="victory"); el.preload="auto"; el.volume=0;
  el.addEventListener("error",function(){
    A.players[name]=null;                       /* file is not there: fall back and keep playing */
    if(A.track===name){ A.track=null; if(A.want) musicStart(A.want); }
  });
  A.players[name]=el;
  return el;
}
function fade(el,to,ms){
  if(!el) return;
  var from=el.volume, t0=performance.now();
  (function step(){
    var p=Math.min(1,(performance.now()-t0)/ms);
    try{ el.volume=clamp(from+(to-from)*p,0,1); }catch(e){}
    if(p<1) requestAnimationFrame(step);
    else if(to===0){ try{ el.pause(); }catch(e){} }
  })();
}
function musicStart(name){
  A.want=name;
  if(!A.unlocked||!A.musicOn){ if(A.musicOn) preloadTrack(name); return; }
  var key=name;
  if(!player(key)) key=MUSIC_FALLBACK[name]||null;
  if(key&&!player(key)) key=null;
  if(A.track===key) return;
  if(A.track&&A.players[A.track]) fade(A.players[A.track],0,300);
  A.track=key;
  if(!key) return;
  var el=player(key);
  try{ if(!el.loop) el.currentTime=0; var p=el.play(); if(p&&p.catch) p.catch(function(){}); }catch(e){}
  fade(el,A.vol*0.55,260);
}
function musicStop(){
  if(A.track&&A.players[A.track]) fade(A.players[A.track],0,400);
  A.track=null; A.want=null;
}
function preloadTrack(name){
  var el=player(name);
  if(!el) return;
  if(el.readyState===0&&el.networkState!==2){ try{ el.load(); }catch(e){} }
}
function preloadAll(){
  if(A.preloaded) return;
  A.preloaded=true;
  if(A.want) preloadTrack(A.want);
  setTimeout(function(){
    Object.keys(MUSIC_FILES).forEach(function(n){ if(n!==A.want) preloadTrack(n); });
  },1500);
}
function audioResume(){
  audioInit();
  if(A.ctx&&A.ctx.state==="suspended"){ try{ A.ctx.resume(); }catch(e){} }
  if(!A.unlocked){
    A.unlocked=true;
    if(A.want) musicStart(A.want);
    preloadAll();
  }
}
function applyAudio(st){
  A.sfxOn=st.sfx; A.musicOn=st.music; A.vol=st.vol;
  if(A.master&&A.ctx) A.master.gain.setTargetAtTime(A.vol,A.ctx.currentTime,0.05);
  if(!A.musicOn){ if(A.track&&A.players[A.track]) fade(A.players[A.track],0,300); A.track=null; }
  else if(A.want) musicStart(A.want);
  else if(A.track&&A.players[A.track]) fade(A.players[A.track],A.vol*0.55,300);
}
function voice(type,f1,f2,t0,dur,peak,cutoff){
  var c=A.ctx; if(!c) return;
  var o=c.createOscillator(), g=c.createGain(), node=o;
  o.type=type; o.frequency.setValueAtTime(f1,t0);
  if(f2&&f2!==f1) o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  if(cutoff){ var f=c.createBiquadFilter(); f.type="lowpass"; f.frequency.setValueAtTime(cutoff,t0); o.connect(f); node=f; }
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002,peak),t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  node.connect(g); g.connect(A.master);
  o.start(t0); o.stop(t0+dur+0.04);
}
function hiss(t0,dur,peak,hp){
  var c=A.ctx; if(!c||!A.noise) return;
  var s=c.createBufferSource(); s.buffer=A.noise;
  var f=c.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp||5000;
  var g=c.createGain();
  g.gain.setValueAtTime(peak,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  s.connect(f); f.connect(g); g.connect(A.master);
  s.start(t0); s.stop(t0+dur+0.02);
}
function sfx(name){
  if(!A.sfxOn) return; var c=audioInit(); if(!c) return;
  var t=c.currentTime;
  if(name==="click")      voice("sine",680,920,t,0.07,0.06,4000);
  else if(name==="tick")  voice("sine",1500,1500,t,0.04,0.05);
  else if(name==="land"){ voice("sine",700,1050,t,0.14,0.12,6000); hiss(t,0.09,0.05,4000); }
  else if(name==="good"){ [784,988,1319].forEach(function(f,i){ voice("sine",f,f,t+i*0.065,0.26,0.1,6000); }); }
  else if(name==="bad"){  voice("sine",330,180,t,0.3,0.09,1400); }
  else if(name==="riser"){ for(var i=0;i<18;i++) hiss(t+i*0.26,0.22,0.018+i*0.001,1200+i*260); }
  else if(name==="unlock"){ [659,880,1175,1568].forEach(function(f,i){ voice("sine",f,f,t+i*0.085,0.4,0.1,8000); }); }
  /* the crown gets a longer, brighter fanfare than anything else in the game */
  else if(name==="crown"){ [1047,1319,1568,2093,2637].forEach(function(f,i){ voice("sine",f,f,t+i*0.075,0.5,0.1,10000); });
                           hiss(t,0.5,0.05,6000); }
  else if(name==="win"){ [523,659,784,1047,1319].forEach(function(f,i){ voice("sine",f,f,t+i*0.14,0.5,0.1,8000); }); }
}

/* ---- confetti ---- */
var confettiStop=0, confettiRunning=false;
function calmMode(){
  return (window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)
      || document.documentElement.classList.contains("calm");
}
function confetti(ms){
  var cv=document.getElementById("confetti"); if(!cv) return;
  if(calmMode()) return;
  cv.hidden=false;
  var ctx=cv.getContext("2d"), parts=[];
  function size(){ cv.width=window.innerWidth; cv.height=window.innerHeight; }
  size();
  var cols=["#ffc83d","#08c9cf","#19c97d","#ff4eb8","#7428e8","#ff624f","#fff5df"];
  for(var i=0;i<180;i++) parts.push({
    x:Math.random()*cv.width, y:-20-Math.random()*cv.height*0.6,
    w:5+Math.random()*8, h:7+Math.random()*10,
    vy:2.4+Math.random()*3.6, vx:-1.6+Math.random()*3.2,
    r:Math.random()*Math.PI, vr:-0.16+Math.random()*0.32,
    c:cols[(Math.random()*cols.length)|0]
  });
  confettiStop=Date.now()+(ms||4200);
  if(confettiRunning) return;
  confettiRunning=true;
  (function frame(){
    ctx.clearRect(0,0,cv.width,cv.height);
    for(var i=0;i<parts.length;i++){
      var p=parts[i]; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
      if(p.y>cv.height+30){ p.y=-20; p.x=Math.random()*cv.width; }
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
      ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    }
    if(Date.now()<confettiStop) requestAnimationFrame(frame);
    else { ctx.clearRect(0,0,cv.width,cv.height); cv.hidden=true; confettiRunning=false; }
  })();
  window.addEventListener("resize",size);
}

/* ---- starfield ---- */
function Stars(){
  var ref=useRef(null);
  useEffect(function(){
    var cv=ref.current; if(!cv) return;
    var ctx=cv.getContext("2d"), stars=[], raf=0, reduce=calmMode();
    function build(){
      cv.width=window.innerWidth; cv.height=window.innerHeight; stars=[];
      var n=Math.min(180,Math.round(cv.width*cv.height/12000));
      for(var i=0;i<n;i++) stars.push({x:Math.random()*cv.width,y:Math.random()*cv.height,
        r:Math.random()*1.6+0.3,p:Math.random()*6.28,s:0.01+Math.random()*0.026});
    }
    build();
    function frame(){
      ctx.clearRect(0,0,cv.width,cv.height);
      for(var i=0;i<stars.length;i++){
        var s=stars[i]; s.p+=s.s;
        ctx.globalAlpha=0.25+Math.abs(Math.sin(s.p))*0.65;
        ctx.fillStyle=i%7===0?"#ffd97a":"#ffffff";
        ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.283); ctx.fill();
      }
      ctx.globalAlpha=1;
      if(!reduce) raf=requestAnimationFrame(frame);
    }
    frame();
    window.addEventListener("resize",build);
    return function(){ cancelAnimationFrame(raf); window.removeEventListener("resize",build); };
  },[]);
  return html`<canvas id="stars" ref=${ref} aria-hidden="true"></canvas>`;
}

/* ============================ bank helpers ============================ */
function defaultBank(){ return clone(SEED); }
function okRow(q){
  if(!q||!CAT_BY_ID[q.cat]||q.cat==="crown") return false;
  var s=side(q,"en"), s2=side(q,"es");
  return !!((s&&s.q&&s.o&&s.o.length===4)||(s2&&s2.q&&s2.o&&s2.o.length===4));
}
function loadBank(){
  var b=lsGet("bc.bank",null);
  if(!b||!b.length) return defaultBank();
  var ok=b.filter(okRow);
  return ok.length?ok:defaultBank();
}
/* The pool a match draws from: subject is chosen by the wheel, so only difficulty,
   language and the verified flag narrow it here. */
function poolFor(bank,s){
  return bank.filter(function(q){
    if(s.difficulty!=="mixed"&&q.dif!==s.difficulty) return false;
    if(s.verifiedOnly&&!q.verified) return false;
    var sd=q[s.language||LANG];
    if(!sd||!sd.q) return false;
    return true;
  });
}
var CSV_HEAD=["id","category","difficulty","answer","verified",
  "scripture_en","question_en","a_en","b_en","c_en","d_en","explanation_en",
  "scripture_es","question_es","a_es","b_es","c_es","d_es","explanation_es"];
function csvCell(v){ v=(v==null?"":String(v)); return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function toCSV(bank){
  var rows=[CSV_HEAD.join(",")];
  bank.forEach(function(q){
    var en=q.en||{o:[]}, es=q.es||{o:[]};
    rows.push([q.id,q.cat,q.dif,"ABCD".charAt(q.a),q.verified?"yes":"no",
      en.ref,en.q,(en.o||[])[0],(en.o||[])[1],(en.o||[])[2],(en.o||[])[3],en.e,
      es.ref,es.q,(es.o||[])[0],(es.o||[])[1],(es.o||[])[2],(es.o||[])[3],es.e].map(csvCell).join(","));
  });
  return rows.join("\n");
}
function parseCSV(text){
  var rows=[],row=[],cur="",q=false,i=0;
  text=text.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  for(;i<text.length;i++){
    var ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else if(ch==='"'){ q=true; }
    else if(ch===","){ row.push(cur); cur=""; }
    else if(ch==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; }
    else cur+=ch;
  }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(function(r){ return r.length>1||r[0]!==""; });
}
function packSide(q,o,e,ref){
  var opts=(o||[]).map(function(x){ return String(x==null?"":x).trim(); });
  return {q:String(q==null?"":q).trim(),o:opts,e:String(e==null?"":e).trim(),ref:String(ref==null?"":ref).trim()};
}
function fullSide(s){ return !!(s&&s.q&&s.o.length===4&&s.o.every(function(x){return x;})); }
/* Accepts three shapes: the bilingual row this game writes, the suffixed CSV columns it
   exports, and a plain single-language row like the one in the project brief. A row that
   carries one language is copied into both so the game never shows an empty question. */
/* A category may arrive as the internal id, or as the subject name in either language —
   an exported bank uses the id, a hand-written one usually does not. */
function resolveCat(raw){
  var s=String(raw==null?"":raw).toLowerCase().trim();
  if(!s) return null;
  if(CAT_BY_ID[s]&&s!=="crown") return s;
  for(var i=0;i<CATS.length;i++){
    var c=CATS[i];
    if(c.short.toLowerCase()===s) return c.id;
    if(String(c.subject.en).toLowerCase()===s) return c.id;
    if(String(c.subject.es).toLowerCase()===s) return c.id;
  }
  /* a couple of spellings the brief and older sheets use */
  if(s.indexOf("prophec")>=0||s.indexOf("profec")>=0) return "prophecy";
  if(s.indexOf("histor")>=0) return "history";
  if(s.indexOf("geogra")>=0) return "geography";
  if(s.indexOf("art")===0||s.indexOf("arte")===0||s.indexOf("music")>=0) return "art";
  if(s.indexOf("sport")>=0||s.indexOf("deport")>=0) return "sports";
  if(s.indexOf("econom")>=0) return "economics";
  if(s.indexOf("riddl")>=0||s.indexOf("acertij")>=0) return "riddles";
  return null;
}
function normalize(o){
  if(!o) return null;
  var cat=resolveCat(o.cat||o.category);
  if(!cat) return null;
  var dif=String(o.dif||o.difficulty||"medium").toLowerCase().trim();
  if(DIFFS.indexOf(dif)<0) dif="medium";
  var en=null, es=null, a;
  if(o.en&&(o.en.q||o.es)){
    en=packSide(o.en.q,o.en.o,o.en.e,o.en.ref);
    es=o.es?packSide(o.es.q,o.es.o,o.es.e,o.es.ref):null;
    a=(o.a!==undefined?o.a:o.answer);
  } else if(o.question_en!==undefined||o.question_es!==undefined){
    en=packSide(o.question_en,[o.a_en,o.b_en,o.c_en,o.d_en],o.explanation_en,o.scripture_en);
    es=packSide(o.question_es,[o.a_es,o.b_es,o.c_es,o.d_es],o.explanation_es,o.scripture_es);
    a=o.answer;
  } else {
    var opts=o.options&&o.options.length?o.options:[o.a,o.b,o.c,o.d];
    var flat=packSide(o.q||o.question,opts,o.e||o.explanation,o.scripture||o.ref);
    var lang=String(o.language||o.lang||LANG).toLowerCase().slice(0,2);
    if(lang==="en"){ en=flat; } else { es=flat; }
    a=(o.correctAnswer!==undefined?o.correctAnswer:o.answer);
  }
  if(typeof a==="string"){
    var l=a.trim().toUpperCase().charAt(0);
    a="ABCD".indexOf(l)>=0?"ABCD".indexOf(l):parseInt(a,10);
  }
  a=parseInt(a,10); if(isNaN(a)||a<0||a>3) return null;
  if(!fullSide(en)&&!fullSide(es)) return null;
  if(!fullSide(en)) en=clone(es);
  if(!fullSide(es)) es=clone(en);
  var v=o.verified;
  v=(v===true||v==="yes"||v==="true"||v==="1"||v===1);
  return {id:o.id||uid(),cat:cat,dif:dif,a:a,verified:v,en:en,es:es};
}
function parseImport(text){
  text=(text||"").trim(); if(!text) return [];
  var out=[];
  if(text.charAt(0)==="["||text.charAt(0)==="{"){
    var data=JSON.parse(text);
    if(!Array.isArray(data)) data=data.questions||data.bank||[data];
    data.forEach(function(o){ var n=normalize(o); if(n) out.push(n); });
  } else {
    var rows=parseCSV(text); if(rows.length<2) return [];
    var head=rows[0].map(function(h){ return String(h).trim().toLowerCase(); });
    for(var i=1;i<rows.length;i++){
      var obj={}; head.forEach(function(h,j){ obj[h]=rows[i][j]; });
      var n=normalize(obj); if(n) out.push(n);
    }
  }
  return out;
}

/* ============================ wheel ============================ */
/* Eight slots. Each one carries a circular medallion of its champion, clipped in SVG so the
   portrait crop reads as a framed coin rather than a cut-out. */
var SEG=360/WHEEL.length;
function Wheel(props){
  var r=96, cx=100, cy=100, mr=61, rad=19;
  function pt(deg,rd){ var a=(deg-90)*Math.PI/180; return [cx+rd*Math.cos(a), cy+rd*Math.sin(a)]; }
  var clips=WHEEL.map(function(c,i){
    var mid=pt(i*SEG+SEG/2,mr);
    return html`<clipPath key=${c.id} id=${"clip-"+c.id}>
      <circle cx=${mid[0].toFixed(2)} cy=${mid[1].toFixed(2)} r=${rad}/></clipPath>`;
  });
  var sectors=WHEEL.map(function(c,i){
    var a1=i*SEG, a2=a1+SEG;
    var p1=pt(a1,r), p2=pt(a2,r), mid=pt(a1+SEG/2,mr);
    return html`<g key=${c.id}>
      <path d=${"M"+cx+","+cy+" L"+p1[0].toFixed(2)+","+p1[1].toFixed(2)+" A"+r+","+r+" 0 0 1 "+p2[0].toFixed(2)+","+p2[1].toFixed(2)+" Z"}
        fill=${"var(--c-"+c.id+")"} stroke="rgba(255,255,255,.92)" stroke-width="1.3"/>
      <image href=${c.img} x=${(mid[0]-rad).toFixed(2)} y=${(mid[1]-rad).toFixed(2)}
        width=${rad*2} height=${rad*2} preserveAspectRatio="xMidYMin slice"
        clip-path=${"url(#clip-"+c.id+")"}/>
      <circle cx=${mid[0].toFixed(2)} cy=${mid[1].toFixed(2)} r=${rad}
        fill="none" stroke="#fff" stroke-width="2"/>
    </g>`;
  });
  return html`<div class="wheel-stage">
    <div class="wheel-glow"></div>
    <div class=${"pointer"+(props.landed?" hit":"")}></div>
    <div class=${"wheel-rotor"+(props.spinning?" spin":"")} style=${{transform:"rotate("+props.rot+"deg)"}}>
      <svg viewBox="0 0 200 200" width="100%" height="100%" aria-hidden="true">
        <defs>${clips}</defs>
        <circle cx="100" cy="100" r="99" fill="rgba(255,255,255,.95)"/>
        ${sectors}
        <circle cx="100" cy="100" r="96.5" fill="none" stroke="rgba(255,255,255,.95)" stroke-width="5"/>
      </svg>
    </div>
    <button class="spin-hub" onClick=${props.onSpin} disabled=${props.spinning||props.disabled}
      aria-label=${T.spin}>${props.spinning?T.spinning:T.spin}</button>
  </div>`;
}

    setM(function(p){
      var ts=clone(p.teams), tm=ts[i], k=tm.unlocked.indexOf(cid);
      if(k>=0){ tm.unlocked.splice(k,1); tm.progress[cid]=0; }
      else { tm.unlocked.push(cid); tm.progress[cid]=p.settings.needed; }
      return Object.assign({},p,{teams:ts});
    });
  }
  function ask(msg,fn){ sfx("click"); setConfirm({msg:msg,fn:fn}); }
  return html`<aside class="drawer" role="dialog" aria-label=${T.teacher}>
    <div class="row between">
      <strong style=${{fontFamily:"var(--f-display)",fontSize:"19px"}}>${T.teacher}</strong>
      <button class="icon-btn" onClick=${props.onClose} aria-label=${T.close}>✕</button>
    </div>

    ${confirm?html`<div class="confirm">
      <div style=${{marginBottom:"9px"}}>${confirm.msg}</div>
      <div class="row">
        <button class="btn sm danger" onClick=${function(){ var f=confirm.fn; setConfirm(null); f(); }}>${T.yes}</button>
        <button class="btn sm ghost" onClick=${function(){ setConfirm(null); }}>${T.no}</button>
      </div></div>`:null}

    <h3>${T.pause}</h3>
    <div class="row">
      <button class=${"btn sm"+(m.paused?"":" ghost")}
        onClick=${function(){ sfx("click"); setM(function(p){return Object.assign({},p,{paused:!p.paused});}); }}>
        ${m.paused?T.unpause:T.pause}</button>
      <button class="btn sm ghost" disabled=${m.phase!=="question"}
        onClick=${function(){ sfx("click"); props.onSkip(); }}>${T.skip}</button>
    </div>

    <h3>${T.activeTeam}</h3>
    <${Seg} value=${m.turn} onChange=${function(v){ setM(function(p){ return Object.assign({},p,{turn:v}); }); }}
      items=${m.teams.map(function(tm,i){ return {v:i,l:tm.name}; })}/>

    <h3>${T.sound}</h3>
    <div class="row">
      <button class=${"btn sm"+(au.sfx?"":" ghost")} onClick=${function(){ props.setAudio({sfx:!au.sfx}); }}>
        ${T.sound}: ${au.sfx?T.on:T.off}</button>
      <button class=${"btn sm"+(au.music?"":" ghost")} onClick=${function(){ props.setAudio({music:!au.music}); }}>
        ${T.music}: ${au.music?T.on:T.off}</button>
    </div>
    <div class="field" style=${{marginTop:"10px"}}><span class="label">${T.volume}</span>
      <${Seg} value=${au.vol} onChange=${function(v){ props.setAudio({vol:v}); }}
        items=${[{v:0.35,l:T.low},{v:0.75,l:T.medium},{v:1,l:T.high}]}/></div>

    <h3>${T.adjust}</h3>
    ${m.teams.map(function(tm,i){ return html`<div key=${tm.id} class="row between" style=${{marginBottom:"8px"}}>
      <span class="row" style=${{gap:"8px",minWidth:0}}>
        <span style=${{width:"10px",height:"10px",borderRadius:"50%",background:tm.color,display:"inline-block"}}></span>
        <b style=${{fontSize:"13.5px"}}>${tm.name}</b>
        <span class="tnum muted" style=${{fontSize:"13px"}}>${tm.score}</span>
      </span>
      <span class="row" style=${{gap:"6px"}}>
        <button class="btn sm ghost" onClick=${function(){bump(i,-100);}}>−100</button>
        <button class="btn sm ghost" onClick=${function(){bump(i,100);}}>+100</button>
      </span></div>`; })}

    <h3>${T.chars}</h3>
    ${m.teams.map(function(tm,i){ return html`<div key=${tm.id} style=${{marginBottom:"12px"}}>
      <div class="row between" style=${{marginBottom:"6px"}}>
        <b style=${{fontSize:"13.5px"}}>${tm.name}</b>
        <span class="tnum muted" style=${{fontSize:"12px"}}>${tm.unlocked.length}/${CATS.length}</span>
      </div>
      <div class="row" style=${{gap:"6px"}}>
        ${CATS.map(function(c){ var got=tm.unlocked.indexOf(c.id)>=0;
          return html`<button key=${c.id} class="icon-btn" title=${cname(c)+" — "+(got?T.revoke:T.grant)}
            onClick=${function(){ if(got){ ask(T.revoke+": "+cname(c)+" — "+tm.name+"?",function(){ toggleChar(i,c.id); }); }
                                  else { sfx("click"); toggleChar(i,c.id); } }}
            style=${{padding:"2px",overflow:"hidden",width:"42px",height:"42px",
              borderColor:got?"var(--c-"+c.id+")":"var(--line)"}}>
            <${Tile} cat=${c.id} dim=${!got} style=${{width:"100%"}}/>
          </button>`; })}
      </div></div>`; })}

    <h3>${T.lifelines}</h3>
    ${m.teams.map(function(tm,i){ return html`<div key=${tm.id} class="row between" style=${{marginBottom:"8px"}}>
      <b style=${{fontSize:"13.5px"}}>${tm.name}</b>
      <span class="row" style=${{gap:"5px"}}>
        ${LIFELINES.map(function(l){
          /* one tap hands this team another one; the arrow puts the whole set back to one each */
          var n=llCount(tm,l.id);
          return html`<button key=${l.id} class=${"btn sm"+(n?"":" ghost")} style=${{padding:"7px 9px",gap:"5px"}}
            title=${llName(l.id)+" ×"+n+" — "+T.llGiveBack}
            onClick=${function(){ sfx("click"); setM(function(p){
              var ts=clone(p.teams);
              migrateLifelines(ts[i]);
              ts[i].lifelines[l.id]=Math.min(LL_CAP,llCount(ts[i],l.id)+1);
              return Object.assign({},p,{teams:ts});
            }); }}><${LLIcon} id=${l.id} size=${15}/><span class="tnum">${n}</span></button>`;
        })}
        <button class="btn sm ghost" style=${{padding:"7px 10px"}} title=${T.llReset}
          onClick=${function(){ sfx("click"); setM(function(p){
            var ts=clone(p.teams); ts[i].lifelines=freshLifelines();
            return Object.assign({},p,{teams:ts});
          }); }}>↺</button>
      </span></div>`; })}

    <h3>${T.setup}</h3>
    <div class="field"><span class="label">${T.timeLimit}</span>
      <${Seg} value=${s.timer} onChange=${function(v){patchSettings("timer",v);}}
        items=${[15,20,30,45,60].map(function(v){return {v:v,l:v+T.sec};})}/></div>
    <div class="field" style=${{marginTop:"12px"}}><span class="label">${T.needed}</span>
      <${Seg} value=${s.needed} onChange=${function(v){patchSettings("needed",v);}}
        items=${[1,2,3].map(function(v){return {v:v,l:String(v)};})}/></div>
    <div class="field" style=${{marginTop:"12px"}}><span class="label">${T.difficulty}</span>
      <${Seg} value=${s.difficulty} onChange=${function(v){patchSettings("difficulty",v);}}
        items=${[{v:"easy",l:T.easy},{v:"medium",l:T.medium},{v:"hard",l:T.hard},{v:"mixed",l:T.mixed}]}/></div>
    <div class="field" style=${{marginTop:"12px"}}><span class="label">${T.chain}</span>
      <${Seg} value=${s.chain||1} onChange=${function(v){patchSettings("chain",v);}}
        items=${[{v:1,l:T.chainOff},{v:2,l:"2"},{v:3,l:"3"},{v:5,l:"5"}]}/></div>
    <div class="field" style=${{marginTop:"12px"}}><span class="label">${T.earn}</span>
      <${Seg} value=${s.earn!==false} onChange=${function(v){patchSettings("earn",v);}}
        items=${[{v:true,l:T.on},{v:false,l:T.off}]}/></div>
    <div class="field" style=${{marginTop:"12px"}}><span class="label">${T.language}</span>
      <${Seg} value=${s.language} onChange=${function(v){patchSettings("language",v);}}
        items=${LANGS.map(function(l){return {v:l.id,l:l.name};})}/></div>

    <h3>${T.review}</h3>
    ${m.log.length?m.log.slice(0,14).map(function(L,i){
      return html`<div key=${i} class="log-item" style=${{"--lc":L.ok?"var(--good)":"var(--bad)"}}>
        <b>${L.team}</b> · ${subj(catOf(L.cat))}${L.crown?" ♛":""} · ${L.ok?T.correct:(L.timeout?T.timeup:T.incorrect)}<br/>
        <span class="muted">${L.q}</span></div>`;
    }):html`<p class="muted" style=${{fontSize:"13.5px"}}>${T.noLog}</p>`}

    <h3>${T.restart}</h3>
    <div class="row">
      <button class="btn sm ghost" onClick=${function(){ ask(T.restart+" — "+T.confirmSure,props.onRestart); }}>${T.restart}</button>
      <button class="btn sm ghost" onClick=${function(){ ask(T.exit+" — "+T.confirmSure,props.onExit); }}>${T.exit}</button>
    </div>
  </aside>`;
}

/* ============================ game ============================ */
/* Seats ring the wheel: two face each other, a third sits below, a fourth set takes the corners. */
function seatStyle(i,n){
  var maps={
    2:[{gridColumn:1,gridRow:2},{gridColumn:3,gridRow:2}],
    3:[{gridColumn:1,gridRow:2},{gridColumn:3,gridRow:2},{gridColumn:2,gridRow:3}],
    4:[{gridColumn:1,gridRow:1},{gridColumn:3,gridRow:1},{gridColumn:1,gridRow:3},{gridColumn:3,gridRow:3}]
  };
  var m=maps[n]||maps[2];
  return m[i]||{gridColumn:1,gridRow:2};
}
function Sparks(){
  var bits=[];
  for(var i=0;i<18;i++){
    var a=i/18*6.283, d=120+Math.random()*120;
    bits.push(html`<i key=${i} style=${{"--dx":(Math.cos(a)*d).toFixed(0)+"px",
      "--dy":(Math.sin(a)*d).toFixed(0)+"px",animationDelay:(i*0.03)+"s"}}></i>`);
  }
  return html`<span class="sparks" aria-hidden="true">${bits}</span>`;
}
function Game(props){
  var m=props.match, setM=props.setMatch, bank=props.bank;
  var s=m.settings, team=m.teams[m.turn];
  var st=useState(0), rot=st[0], setRot=st[1];
  var sp=useState(false), spinning=sp[0], setSpinning=sp[1];
  var ld=useState(false), landed=ld[0], setLanded=ld[1];
  var dr=useState(false), drawer=dr[0], setDrawer=dr[1];
  var to=useState(null), toast=to[0], setToast=to[1];
  var fl=useState(false), flash=fl[0], setFlash=fl[1];
  var timers=useRef([]);
  useEffect(function(){ return function(){ timers.current.forEach(clearTimeout); }; },[]);
  function later(fn,ms){ var id=setTimeout(fn,ms); timers.current.push(id); return id; }

  useEffect(function(){
    if(m.phase==="question") musicStart("quiz");
    else if(m.phase==="victory") musicStart("victory");
    else musicStart("board");
  },[m.phase]);

  useEffect(function(){
    if(m.phase!=="question"||m.paused||m.consult) return;
    var iv=setInterval(function(){
      setM(function(p){
        if(p.phase!=="question"||p.paused||p.consult) return p;
        return Object.assign({},p,{timeLeft:Math.max(0,Math.round((p.timeLeft-0.25)*100)/100)});
      });
    },250);
    return function(){ clearInterval(iv); };
  },[m.phase,m.paused,!!m.consult]);
  useEffect(function(){ if(m.phase==="question"&&m.timeLeft<=0) answer(null); },[m.phase,m.timeLeft]);
  useEffect(function(){
    if(m.phase==="question"&&!m.paused&&!m.consult&&m.timeLeft>0&&m.timeLeft<=5&&m.timeLeft%1===0) sfx("tick");
  },[m.timeLeft]);

  /* the "ask a team" window runs on its own clock while the question clock waits */
  useEffect(function(){
    if(!m.consult||m.paused) return;
    var iv=setInterval(function(){
      setM(function(p){
        if(!p.consult||p.paused) return p;
        var left=Math.max(0,Math.round((p.consult.left-0.25)*100)/100);
        return Object.assign({},p,{consult:left<=0?null:{left:left,total:p.consult.total}});
      });
    },250);
    return function(){ clearInterval(iv); };
  },[!!m.consult,m.paused]);
  useEffect(function(){
    if(m.consult&&!m.paused&&m.consult.left>0&&m.consult.left<=5&&m.consult.left%1===0) sfx("tick");
  },[m.consult&&m.consult.left]);

  /* a match never runs on past a full collection, however the champion was granted */
  useEffect(function(){
    if(m.phase==="victory"||m.phase==="unlock"||m.pendingUnlock) return;
    for(var i=0;i<m.teams.length;i++){
      if(m.teams[i].unlocked.length>=CATS.length){
        sfx("win"); confetti(11000);
        setM(function(p){ return Object.assign({},p,{phase:"victory",winner:i,endedAt:Date.now()}); });
        return;
      }
    }
  },[m.teams,m.phase]);

  useEffect(function(){
    function onKey(ev){
      var tag=(ev.target&&ev.target.tagName)||"";
      if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT") return;
      if(m.paused) return;
      if(m.phase==="question"){
        var k=String(ev.key).toLowerCase();
        var i="abcd".indexOf(k); if(i<0) i="1234".indexOf(k);
        if(i>=0){ ev.preventDefault(); answer(i); }
      } else if(ev.key===" "||ev.key==="Enter"){
        if(m.phase==="spin"){ ev.preventDefault(); spin(); }
        else if(m.phase==="feedback"){ ev.preventDefault(); cont(); }
        else if(m.phase==="unlock"){ ev.preventDefault(); collect(); }
        else if(m.phase==="crownIntro"){ ev.preventDefault(); toPick(); }
      }
    }
    window.addEventListener("keydown",onKey);
    return function(){ window.removeEventListener("keydown",onKey); };
  },[m,rot,spinning]);

  /* One place decides what an answer is worth: points by difficulty, the streak bonus, the
     crown bonus, the unlock bonus, whether this answer completes a champion, whether it earns
     a lifeline, and whether the team keeps the wheel. */
  function resolveAnswer(p,pick){
    var q=p.q, ok=(pick!==null&&pick===q.a);
    var teams=clone(p.teams), tm=teams[p.turn];
    var gained=0, unlock=null, crownMissed=false, bonus=0, got=null;
    if(ok){
      gained=POINTS[q.dif]||100;
      tm.correct++;
      tm.streak=(tm.streak||0)+1;
      if(tm.streak>(tm.best||0)) tm.best=tm.streak;
      bonus=streakBonus(tm.streak);
      gained+=bonus;
      if(q.crown){ gained+=CROWN_BONUS; tm.crownWins=(tm.crownWins||0)+1; }
      if(tm.unlocked.indexOf(q.cat)<0){
        if(q.crown){
          /* the crown challenge wins the champion outright, whatever `needed` says */
          tm.progress[q.cat]=p.settings.needed; tm.unlocked.push(q.cat); unlock=q.cat;
        } else {
          tm.progress[q.cat]=(tm.progress[q.cat]||0)+1;
          if(tm.progress[q.cat]>=p.settings.needed){ tm.unlocked.push(q.cat); unlock=q.cat; }
        }
        if(unlock) gained+=UNLOCK_BONUS;
      }
      tm.score+=gained;
      /* a prize for the streak, and one for the crown — never two from the same answer */
      if(p.settings.earn){
        if(tm.streak%STREAK_STEP===0) got=grantLifeline(tm);
        else if(q.crown) got=grantLifeline(tm);
      }
    } else {
      tm.wrong++;
      tm.streak=0;
      if(q.crown) crownMissed=true;
    }
    var log=p.log.slice(0,59);
    log.unshift({team:tm.name,cat:q.cat,ok:ok,timeout:pick===null,crown:!!q.crown,q:q.q});
    return Object.assign({},p,{phase:"feedback",teams:teams,pick:pick,ok:ok,gained:gained,
      streakBonus:bonus,gotLL:got,again:ok&&(p.chain||1)<(p.settings.chain||1),
      pendingUnlock:unlock,crownMissed:crownMissed,log:log,consult:null,second:false});
  }
  function answer(pick){
    if(m.phase!=="question") return;
    /* a second chance swallows the first wrong answer: that option is struck out and the
       team carries on against the same clock */
    if(pick!==null&&pick!==m.q.a&&m.second){
      sfx("bad");
      setM(function(p){ return Object.assign({},p,{second:false,strike:pick}); });
      return;
    }
    var next=resolveAnswer(m,pick);
    sfx(next.ok?"good":"bad");
    setM(next);
  }
  function cont(){
    sfx("click");
    if(m.pendingUnlock){ sfx("unlock"); confetti(3000); setM(Object.assign({},m,{phase:"unlock"})); return; }
    setM(Object.assign({},m,{crownMissed:false}));
    later(m.again?sameTeam:nextTurn,10);
  }
  function collect(){
    sfx("click");
    var next=Object.assign({},m,{pendingUnlock:null,crownMissed:false});
    if(m.teams[m.turn].unlocked.length>=CATS.length){
      sfx("win"); confetti(11000);
      setM(Object.assign(next,{phase:"victory",winner:m.turn,endedAt:Date.now()}));
      return;
    }
    setM(next);
    later(m.again?sameTeam:nextTurn,10);
  }
  /* A lifeline is spent from the team's own stock. Five of them, and each one changes the
     question in a different way: more time, a pause to consult, fewer wrong options, a second
     attempt, or a different question from the same subject. */
  function llOff(l){
    return llCount(team,l.id)<1||!!m.consult
      ||(l.mode==="fifty"&&!!m.hidden)
      ||(l.mode==="second"&&!!m.second);
  }
  function useLifeline(id){
    if(m.phase!=="question"||m.paused||m.consult) return;
    var spec=llSpec(id);
    if(!spec||llOff(spec)) return;
    sfx(spec.mode==="fifty"?"land":"unlock");
    setM(function(p){
      var teams=clone(p.teams), tm=teams[p.turn];
      var left=llCount(tm,id)-1;
      if(left<0) return p;
      tm.lifelines[id]=left;
      if(spec.mode==="extend")
        return Object.assign({},p,{teams:teams,
          timeLeft:p.timeLeft+spec.secs,
          timeMax:(p.timeMax||p.settings.timer)+spec.secs});
      if(spec.mode==="consult")
        return Object.assign({},p,{teams:teams,consult:{left:spec.secs,total:spec.secs}});
      if(spec.mode==="second")
        return Object.assign({},p,{teams:teams,second:true});
      if(spec.mode==="fifty"){
        /* clear away the wrong options but always leave one standing beside the answer, so a
           bomb after a second chance is still a choice and not a free point */
        var wrongs=[0,1,2,3].filter(function(i){ return i!==p.q.a&&i!==p.strike; });
        return Object.assign({},p,{teams:teams,hidden:shuffle(wrongs).slice(0,Math.max(0,wrongs.length-1))});
      }
      /* swap: a new question from the same subject, on a fresh clock */
      var d=drawQuestion(p,p.q.cat,!!p.q.crown);
      if(!d) return p;
      return Object.assign({},p,{teams:teams,q:d.q,used:d.used,recycled:d.recycled,
        timeLeft:p.settings.timer,timeMax:p.settings.timer,
        pick:null,ok:null,hidden:null,second:false,strike:null});
    });
  }
  function toPick(){ sfx("click"); setM(function(p){ return Object.assign({},p,{phase:"crownPick"}); }); }
  /* A turn ends the same way whether the team keeps the wheel after a correct answer or
     hands it on; only the seat and the spin counter differ. */
  function freshTurn(p,same){
    return Object.assign({},p,{phase:"spin",
      turn:same?p.turn:(p.turn+1)%p.teams.length,
      chain:same?(p.chain||1)+1:1,
      q:null,cat:null,pick:null,ok:null,gained:0,streakBonus:0,gotLL:null,again:false,
      pendingUnlock:null,crownMissed:false,fromWheel:false,
      timeLeft:p.settings.timer,timeMax:p.settings.timer,
      consult:null,recycled:false,hidden:null,second:false,strike:null});
  }
  function nextTurn(){ setLanded(false); setM(function(p){ return freshTurn(p,false); }); }
  function sameTeam(){ setLanded(false); setM(function(p){ return freshTurn(p,true); }); }
  function drawQuestion(p,catId,isCrown){
    var pool=poolFor(bank,p.settings).filter(function(q){ return q.cat===catId; });
    if(!pool.length) return null;
    var used=p.used||{};
    var avail=pool.filter(function(q){ return !used[q.id]; });
    var recycled=false;
    /* never block a match for running out: the subject's questions come back round */
    if(!avail.length){ used=Object.assign({},used); pool.forEach(function(q){ delete used[q.id]; }); avail=pool; recycled=true; }
    var row=avail[Math.floor(Math.random()*avail.length)];
    var v=side(row,p.settings.language);
    var order=p.settings.shuffleOpts?shuffle([0,1,2,3]):[0,1,2,3];
    var nu=Object.assign({},used); nu[row.id]=1;
    return {used:nu,recycled:recycled,q:{
      id:row.id,cat:row.cat,dif:row.dif,crown:!!isCrown,verified:!!row.verified,
      q:v.q,o:order.map(function(k){return v.o[k];}),a:order.indexOf(row.a),e:v.e,ref:v.ref}};
  }
  function loadQuestion(catId,isCrown){
    setM(function(p){
      var d=drawQuestion(p,catId,isCrown);
      if(!d) return Object.assign({},p,{phase:isCrown?"crownPick":"spin",noPool:true});
      return Object.assign({},p,{phase:"question",q:d.q,used:d.used,
        timeLeft:p.settings.timer,timeMax:p.settings.timer,consult:null,
        pick:null,ok:null,recycled:d.recycled,noPool:false,
        hidden:null,second:false,strike:null});
    });
  }
  useEffect(function(){ if(m.noPool){ setToast(T.noQuestions); setM(function(p){return Object.assign({},p,{noPool:false});}); } },[m.noPool]);
  useEffect(function(){ if(m.recycled){ setToast(T.recycled); setM(function(p){return Object.assign({},p,{recycled:false});}); } },[m.recycled]);

  function spin(){
    if(spinning||m.phase!=="spin"||m.paused) return;
    audioResume(); setLanded(false);
    var i=Math.floor(Math.random()*WHEEL.length);
    var target=(360-(i*SEG+SEG/2)+360)%360;
    var delta=(((target-(rot%360))%360)+360)%360;
    setRot(rot+360*6+delta); setSpinning(true); sfx("riser");
    later(function(){
      setSpinning(false); setLanded(true); sfx("land");
      var hit=WHEEL[i];
      setM(function(p){ return Object.assign({},p,{phase:"reveal",cat:hit.id}); });
      later(function(){
        if(hit.id==="crown"){
          sfx("crown");
          setFlash(true); later(function(){ setFlash(false); },1100);
          setM(function(p){ return Object.assign({},p,{phase:"crownIntro",fromWheel:true}); });
        } else {
          loadQuestion(hit.id,false);
        }
      },1500);
    },5250);
  }
  function skip(){ setDrawer(false); nextTurn(); }
  function restart(){
    setDrawer(false); setLanded(false);
    setM(function(p){
      var ts=p.teams.map(function(tm){ var n=clone(tm);
        n.score=0; n.correct=0; n.wrong=0; n.unlocked=[]; n.progress={}; n.crownWins=0;
        n.streak=0; n.best=0; n.lifelines=freshLifelines(); return n; });
      return Object.assign({},p,{teams:ts,turn:0,chain:1,used:{},log:[],phase:"spin",q:null,cat:null,
        pick:null,ok:null,gained:0,streakBonus:0,gotLL:null,again:false,
        pendingUnlock:null,crownMissed:false,hidden:null,second:false,strike:null,
        fromWheel:false,winner:null,paused:false,timeLeft:p.settings.timer,timeMax:p.settings.timer});
    });
  }

  if(m.phase==="victory"){
    var w=m.teams[m.winner];
    var ranked=m.teams.slice().sort(function(a,b){ return (b.unlocked.length-a.unlocked.length)||(b.score-a.score); });
    return html`<div class="wrap victory">
      <div style=${{fontSize:"58px",lineHeight:1}}>🏆</div>
      <div class="eyebrow">${T.winner}</div>
      <h2 class="winner-name">${w.name}</h2>
      <span class="chip gold tnum" style=${{fontSize:"16px"}}>${T.finalScore}: ${w.score} ${T.pts}</span>
      <div class="winner-cast">${CATS.map(function(c){ return html`<${Tile} key=${c.id} cat=${c.id} on=${true}/>`; })}</div>
      <${Tile} cat="crown" style=${{width:"120px"}}/>
      <div class="card results">
        <div class="eyebrow" style=${{marginBottom:"12px"}}>${T.summary}</div>
        <table><thead><tr>
          <th>${T.team}</th><th>${T.characters}</th><th>${T.crowns}</th>
          <th>${T.hits}</th><th>${T.misses}</th><th>${T.bestStreak}</th>
          <th style=${{textAlign:"right"}}>${T.score}</th>
        </tr></thead><tbody>
        ${ranked.map(function(tm){ return html`<tr key=${tm.id}>
          <td><span style=${{display:"inline-block",width:"9px",height:"9px",borderRadius:"50%",
            background:tm.color,marginRight:"9px"}}></span>${tm.name}</td>
          <td class="tnum">${tm.unlocked.length}/${CATS.length}</td>
          <td class="tnum">${tm.crownWins||0}</td>
          <td class="tnum">${tm.correct}</td><td class="tnum">${tm.wrong}</td>
          <td class="tnum">${tm.best||0}</td>
          <td class="num">${tm.score}</td>
        </tr>`; })}
        </tbody></table>
      </div>
      <div class="row" style=${{justifyContent:"center"}}>
        <button class="btn lg" onClick=${function(){ sfx("click"); restart(); }}>${T.playAgain}</button>
        <button class="btn lg ghost" onClick=${function(){ sfx("click"); props.onNewGame(); }}>${T.newGame}</button>
      </div>
    </div>`;
  }

  var middle;
  if(m.phase==="question"||m.phase==="feedback"){
    var q=m.q, c=catOf(q.cat), done=m.phase==="feedback";
    var tmax=m.timeMax||s.timer;
    var pct=clamp(m.timeLeft/tmax*100,0,100);
    var prog=(team.progress&&team.progress[q.cat])||0;
    middle=html`<div class=${"qcard"+(q.crown?" crown":"")} style=${catVars(q.cat)}>
      <div class="qhead">
        <${Tile} cat=${q.cat}/>
        <span class="cat">${cname(c)}</span>
        <span class="tag cat">${subj(c)}</span>
        ${q.crown?html`<span class="chip gold">♛ ${T.crownQuestion}</span>`:null}
        <span class="tag">${T[q.dif]} · ${POINTS[q.dif]}</span>
        ${!q.crown&&team.unlocked.indexOf(q.cat)<0
          ?html`<span class="tag">${T.progress} ${Math.min(prog,s.needed)}/${s.needed}</span>`:null}
        ${!q.verified?html`<span class="tag warn">${T.unverified}</span>`:null}
      </div>
      <div class="timer-track"><div class=${"timer-fill"+(m.timeLeft<=5?" warn":"")} style=${{width:pct+"%"}}></div></div>
      <h2 class="qtext">${q.q}</h2>
      <div class="opts">
        ${q.o.map(function(txt,i){
          var gone=!!(m.hidden&&m.hidden.indexOf(i)>=0), struck=(m.strike===i);
          var cls="opt";
          if(gone) cls+=" gone";
          if(struck&&!done) cls+=" struck";
          if(done){ cls+= i===q.a?" correct":(i===m.pick?" wrong":" dim"); }
          return html`<button key=${i} class=${cls} disabled=${done||m.paused||gone||struck}
            onClick=${function(){ answer(i); }}>
            <span class="key">${"ABCD".charAt(i)}</span><span>${txt}</span></button>`;
        })}
      </div>
      ${!done?html`<div class="lifelines">
        ${LIFELINES.map(function(l){
          var n=llCount(team,l.id), armed=(l.mode==="second"&&m.second);
          return html`<button key=${l.id} class=${"ll"+(armed?" armed":"")} disabled=${llOff(l)}
            title=${llHint(l.id)} onClick=${function(){ useLifeline(l.id); }}>
            <${LLIcon} id=${l.id}/>
            <span class="nm">${llName(l.id)}</span>
            <span class="secs">${armed?T.llArmed:(n?"×"+n:T.llUsed)}</span></button>`;
        })}
      </div>`:null}
      ${done?html`<div class=${"verdict "+(m.ok?"ok":"no")}>
          <span class="big">${m.ok?T.correct:(m.pick===null?T.timeup:T.incorrect)}</span>
          ${m.ok?html`<span class="chip tnum">+${m.gained} ${T.pts}</span>`:null}
          ${m.streakBonus?html`<span class="chip flame tnum">🔥 ${team.streak} · +${m.streakBonus}</span>`:null}
          ${m.gotLL?html`<span class="chip gold">${T.llEarned}: ${llName(m.gotLL)}</span>`:null}
          ${m.crownMissed?html`<span class="chip">${T.crownMissed}</span>`:null}
          ${m.again?html`<span class="chip">${T.keepPlaying}</span>`:null}
        </div>
        <div class="explain">
          ${q.ref?html`<span class="tag ref scripture">${q.ref}</span><br/>`:null}
          ${!m.ok?html`<b>${T.answerWas}: ${"ABCD".charAt(q.a)}. ${q.o[q.a]}</b><br/>`:null}
          ${q.e}
          ${m.ok&&!m.pendingUnlock&&!q.crown&&team.unlocked.indexOf(q.cat)>=0
            ?html`<div style=${{marginTop:"7px",fontSize:"13.5px"}}>${T.already}</div>`:null}
        </div>
        <button class="btn block" onClick=${cont}>${m.pendingUnlock?T.collect:(m.again?T.keepTurn:T.next)}</button>`:null}
    </div>`;
  } else if(m.phase==="crownPick"){
    var mine=m.teams[m.turn];
    middle=html`<div style=${{display:"flex",flexDirection:"column",alignItems:"center",gap:"16px",width:"100%"}}>
      <div style=${{textAlign:"center"}}>
        <div class="eyebrow">♛ ${T.crownQuestion}</div>
        <h2 style=${{fontSize:"clamp(20px,2.8vw,28px)",marginTop:"5px"}}>${T.crownPick}</h2>
      </div>
      <div class="crown-pick">
        ${CATS.map(function(c){
          var got=mine.unlocked.indexOf(c.id)>=0;
          return html`<button key=${c.id} class="pick-btn" style=${catVars(c.id)} disabled=${got}
            onClick=${function(){ sfx("click"); loadQuestion(c.id,true); }}>
            <${Tile} cat=${c.id} dim=${got} on=${!got}/>
            <span class="nm">${c.short}</span>
            <span class="got">${got?T.collected:subj(c)}</span>
          </button>`;
        })}
      </div>
    </div>`;
  } else if(m.phase==="reveal"){
    var rc=catOf(m.cat);
    middle=html`<${React.Fragment}>
      <${Wheel} rot=${rot} spinning=${false} landed=${landed} disabled=${true} onSpin=${function(){}}/>
      <div class="cat-reveal" style=${catVars(m.cat)}>
        <${Tile} cat=${m.cat} on=${true}/>
        <span class="nm">${rc.short}<small>${subj(rc)}</small></span></div>
    <//>`;
  } else {
    /* the hub stays dead unless it really is this team's moment to spin: an overlay on top of
       it (unlock, crown) must not leave a live button underneath */
    middle=html`<${Wheel} rot=${rot} spinning=${spinning} landed=${landed}
      disabled=${m.paused||m.phase!=="spin"} onSpin=${spin}/>`;
  }

  return html`<div class="wrap">
    <div class="topbar">
      <span class="brand">Bible <span>Champions</span></span>
      <span class="spacer"></span>
      ${m.paused?html`<span class="chip">⏸ ${T.paused}</span>`:null}
      <button class="icon-btn" title=${T.music}
        onClick=${function(){ props.setAudio({music:!props.audio.music}); }}>${props.audio.music?"♪":"𝄽"}</button>
      <button class="icon-btn" title=${T.teacher} onClick=${function(){ sfx("click"); setDrawer(true); }}>⚙</button>
    </div>
    <div class="turn-bar" style=${{"--tc":team.color}}>
      <span class="eyebrow">${T.turn}</span>
      <span class="who">${team.name}</span>
      ${s.chain>1?html`<span class="chip tnum">${T.spinOf} ${m.chain||1}/${s.chain}</span>`:null}
      <span class="spacer"></span>
      ${team.streak>=2?html`<span class="chip flame tnum">🔥 ${team.streak}</span>`:null}
      <span class="chip tnum">${team.score} ${T.pts}</span>
      <span class="chip tnum">${team.unlocked.length}/${CATS.length}</span>
    </div>
    <div class="arena">
      <div class="center">${middle}</div>
      ${m.teams.map(function(tm,i){
        return html`<div key=${tm.id} class="seat" style=${seatStyle(i,m.teams.length)}>
          <${TeamCard} team=${tm} settings=${s} active=${i===m.turn}/></div>`;
      })}
    </div>

    ${flash?html`<div class="goldflash" aria-hidden="true"></div>`:null}

    ${m.consult?html`<div class="overlay">
      <div class="sheet">
        <div class="eyebrow">${T.consultTitle}</div>
        <div style=${{color:"var(--gold)"}}><${LLIcon} id="ask" size=${54}/></div>
        <div class="consult-num tnum">${Math.ceil(m.consult.left)}</div>
        <div class="consult-ring"><i style=${{width:(m.consult.left/m.consult.total*100)+"%"}}></i></div>
        <p class="muted" style=${{fontWeight:700}}>${T.consultSub}</p>
        <button class="btn lg block" onClick=${function(){ sfx("click"); setM(function(p){ return Object.assign({},p,{consult:null}); }); }}>${T.consultDone}</button>
      </div></div>`:null}

    ${m.phase==="unlock"&&m.pendingUnlock?html`<div class="overlay">
      <div class="rays"></div>
      <div class="sheet" style=${catVars(m.pendingUnlock)}>
        <${Sparks}/>
        <div class="eyebrow">${T.unlocked}</div>
        <${Tile} cat=${m.pendingUnlock} cls="hero" on=${true}/>
        <h2 style=${{color:"var(--cc)",fontSize:"clamp(21px,3.4vw,30px)"}}>${cname(catOf(m.pendingUnlock))}</h2>
        <span class="chip gold tnum">${team.name} · +${UNLOCK_BONUS} ${T.pts}</span>
        <button class="btn lg block" onClick=${collect}>${T.collect}</button>
      </div></div>`:null}

    ${m.phase==="crownIntro"?html`<div class="overlay">
      <div class="rays"></div>
      <div class="sheet">
        <${Sparks}/>
        <div class="eyebrow">${m.fromWheel?T.crownLanded:T.crownQuestion}</div>
        <${Tile} cat="crown" cls="hero"/>
        <h2 class="crown-title">${T.crownPower}</h2>
        <span class="chip gold">${team.name}</span>
        <p class="muted" style=${{fontWeight:600,fontSize:"14.5px"}}>${T.crownIntro}</p>
        <button class="btn lg block" onClick=${toPick}>${T.continueB}</button>
      </div></div>`:null}

    ${drawer?html`<${Drawer} match=${m} setMatch=${setM} audio=${props.audio} setAudio=${props.setAudio}
      onClose=${function(){setDrawer(false);}} onSkip=${skip} onRestart=${restart} onExit=${props.onExit}/>`:null}
    ${toast?html`<${Toast} msg=${toast} onDone=${function(){setToast(null);}}/>`:null}
  </div>`;
}

    ["Answer in time","Four options, one correct. Running out of time counts as a wrong answer."],
    ["Right answer, spin again","The turn only passes when you miss. Three in a row is worth a bonus and earns a lifeline."],
    ["Spend a lifeline","Five of them: more time, a pause to ask another team, a bomb that clears wrong options, a second chance, and a skip to a different question."],
    ["Collect a champion","Enough correct answers in a subject and that champion joins your collection."],
    ["Crown is a shortcut, not a gift","Land on Crown and you choose any champion you are missing — then answer one special question from that subject. Right, it is yours at once. Wrong, you lose the turn."],
    ["Win the match","The first team holding all seven champions wins."]
  ];
  return [
    ["Formen los equipos","De dos a cuatro equipos, cada uno con nombre y color. Se sientan alrededor de la ruleta."],

    ["Ganen la partida","El primer equipo que reúna los siete campeones gana."]
  ];
}
